name: Diagnose an existing proxy rejection
on:
  push:
    branches: [codex/meal-retry-20261125]
    paths: [.github/workflows/crawler.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import re
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import urlopen
          key = os.environ.get('SCRAPER_API_KEY', '').strip()
          if not key:
              print('Proxy configuration missing')
              raise SystemExit(0)
          query = urlencode({'api_key': key, 'country_code': 'kr',
                             'url': 'https://coop.knu.ac.kr/sub03/sub01_01.html?shop_sqno=35'})
          try:
              response = urlopen('https://api.scraperapi.com?' + query, timeout=25)
          except HTTPError as error:
              response = error
          except URLError as error:
              print('Proxy network error:', type(error.reason).__name__)
              raise SystemExit(0)
          with response:
              body = response.read(100000).decode('utf-8', 'replace').casefold()
              print('PROXY_STATUS', response.status)
              clues = {
                  'origin-hosting-denial': r'gabia|요청한 페이지에 접근 권한',
                  'geo-restriction': r'(geo.?target|country.code|country).{0,100}(plan|not support|only)|(plan|only).{0,100}(geo.?target|country.code)',
                  'key-error': r'(invalid|incorrect|missing).{0,30}(api key|apikey|api_key)',
                  'quota-error': r'out of credits|quota exceeded|credits.{0,20}(exhausted|insufficient)|insufficient credits',
                  'blocked-destination': r'(domain|url|target).{0,45}(not allowed|blocked|not permitted|restricted)',
                  'menu-table': r'week_t|tstyle_me',
              }
              print('PROXY_CLUES', [label for label, pattern in clues.items() if re.search(pattern, body)])
          PY
