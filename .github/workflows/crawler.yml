name: Daily Meal Crawler

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - get_menu.py
      - tests/**
      - .github/workflows/crawler.yml
  schedule:
    - cron: '23 21 * * *'

permissions:
  contents: write

concurrency:
  group: meal-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test crawler regressions
        run: python -m unittest discover -s tests -v
      - name: Collect shared meal data
        id: crawl
        continue-on-error: true
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python get_menu.py
      - name: Save meal data or failure status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add menu.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update shared meal data and crawl status"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Report collection failure
        if: steps.crawl.outcome == 'failure'
        run: |
          echo "::error::Meal collection failed. Previous meals were preserved with a failure status."
          exit 1
