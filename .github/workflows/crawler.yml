name: Meal validation and daily collection
on:
  workflow_dispatch:
  schedule:
    - cron: '23 21 * * *'
  push:
    branches: [main]
    paths:
      - get_menu.py
      - index.html
      - meal-config.js
      - meal-status.js
      - test_2/**
      - scripts/**
      - tests/**
      - requirements.txt
      - vercel.json
      - .github/workflows/crawler.yml
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: meal-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_meal_status.cjs
      - run: node scripts/build-static.cjs
      - run: node --test tests/test_data_contract.cjs
  collect:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Collect shared meal data
        id: crawl
        continue-on-error: true
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python get_menu.py
      - name: Save meal data or failure status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add menu.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Update shared meal data and crawl status"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Report collection failure
        if: always() && steps.crawl.outcome == 'failure'
        run: |
          echo "::error::Meal collection was incomplete. Previous meals are retained where possible."
          exit 1
