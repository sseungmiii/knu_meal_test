name: Daily Meal Crawler

on:
  workflow_dispatch:
  schedule:
    # 매일 한국 시간 기준 아침 6시 23분 실행 (UTC 21:23)
    - cron: '23 21 * * *'

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.11 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 크롤링 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 식단 크롤러 실행
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          python get_menu.py

      - name: 변경된 menu.json 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add menu.json
          if git diff --staged --quiet; then
            echo "변경된 식단 데이터가 없습니다. 커밋을 건너뜁니다."
          else
            git commit -m "Auto Update: menu.json 최신화"
            git push
          fi