name: Check proxy credit availability
on:
  push:
    branches: [codex/meal-retry-20261125]
    paths: [.github/workflows/crawler.yml]
permissions:
  contents: read
jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import urlopen
          key = os.environ.get("SCRAPER_API_KEY", "").strip()
          if not key:
              print("ACCOUNT_RESULT missing-config")
              raise SystemExit(0)
          try:
              with urlopen("https://api.scraperapi.com/account?" + urlencode({"api_key": key}), timeout=15) as response:
                  account = json.load(response)
              used, limit = account.get("requestCount"), account.get("requestLimit")
              if type(used) in (int, float) and type(limit) in (int, float):
                  print("ACCOUNT_RESULT", "credits-exhausted" if used >= limit else "credits-remaining")
              else:
                  print("ACCOUNT_RESULT credit-fields-unavailable")
          except HTTPError as error:
              print("ACCOUNT_RESULT http", error.code)
          except (URLError, OSError, ValueError):
              print("ACCOUNT_RESULT unavailable")
          PY
